# Configuration for determining which areas are affected by changed files

# Patterns that affect both server and app
BOTH=".github/workflows/*|.github/config/affected-areas.conf|justfile|package.json|pnpm-lock.yaml|.node-version|oxlint.config.ts|oxfmt.config.ts"

# Patterns that affect server only
SERVER="server/*|docker-compose.yml|.oxlintrc.json|.oxfmtrc.json|tsconfig.json|.env.example"

# Patterns that affect app only
APP="app/*|.swift-format|scripts/check-localizations*|tsconfig.scripts.json"
