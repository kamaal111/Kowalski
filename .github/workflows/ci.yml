name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test affected-area detection
        run: bash .github/scripts/determine-affected-areas.test.sh

      - name: Determine affected areas
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/determine-affected-areas.sh

  server:
    name: Server checks
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Prepare server
        run: just prepare-server-ci

      - name: Run quality checks for server
        run: just quality-server

      - name: Run server tests
        run: just test-server

  app:
    name: App checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Install localization tooling dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Bootstrap app
        run: just bootstrap-app

      - name: Run quality checks for app
        run: just quality-app

      - name: Run localization tooling quality checks
        run: just quality-tools

      - name: Test localization validation
        run: just test-localization-check

      - name: Run app tests and verify macOS localization coverage
        env:
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: just test-app-ci

      - name: Upload snapshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-snapshots
          path: |
            app/KowalskiFeatures/Tests/**/__Snapshots__/**/*.png
            ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore
          retention-days: 7
